kind = "video"
videoAspectRatio = "16:9"
previewPath = "/patient-pipeline-facebook-zapier/"
title = "Patient Pipeline — Facebook & Instagram Without GoHighLevel"
description = "Complete standalone beginner tutorial using Zapier, matching the approved Sarah narration, visible typing, cursor clicks, and zooms. External screens are clearly labeled instructional recreations."
version = "1.0.0"
id = "artifacts/patient-pipeline-facebook-zapier"
router = "path"

[[services]]
name = "web"
paths = [ "/patient-pipeline-facebook-zapier/" ]
localPort = 20912

[services.development]
run = "pnpm --filter @workspace/patient-pipeline-facebook-zapier run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/patient-pipeline-facebook-zapier", "run", "build" ]
serve = "static"
publicDir = "artifacts/patient-pipeline-facebook-zapier/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20912"
BASE_PATH = "/patient-pipeline-facebook-zapier/"
